services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobassistant
      POSTGRES_PASSWORD: jobassistant
      POSTGRES_DB: jobassistant
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobassistant -d jobassistant"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  rag-api:
    build:
      context: ./services/rag-api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${RAG_PORT:-8001}:8001"
    volumes:
      - faiss_data:/data/faiss
    environment:
      FAISS_STORE_DIR: /data/faiss

  ai-agent:
    build:
      context: ./services/ai-agent
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${AI_AGENT_PORT:-8002}:8002"
    environment:
      # Host-published API (run `dotnet` on the host). Override if needed.
      JOB_ASSISTANT_API_BASE_URL: "${JOB_ASSISTANT_API_BASE_URL:-http://host.docker.internal:5287}"
      RAG_API_BASE_URL: "${RAG_API_BASE_URL:-http://rag-api:8001}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - rag-api

volumes:
  pgdata:
  faiss_data:
